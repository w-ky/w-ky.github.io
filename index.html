<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script
      src="https://video.sdk.qcloudecdn.com/web/TXLivePusher-2.1.1.min.js"
      charset="utf-8"
    ></script>

    <div
      id="local_video"
      style="
        width: 100%;
        height: 500px;
        display: flex;
        align-items: center;
        justify-content: center;
      "
    ></div>

    <script>
      const livePusher = new TXLivePusher();
      livePusher.setRenderView("local_video");
      livePusher.videoView.muted = true;

      // 设置视频质量
      livePusher.setVideoQuality("720p");
      // 设置音频质量
      livePusher.setAudioQuality("standard");
      // 自定义设置帧率
      livePusher.setProperty("setVideoFPS", 25);

      // 打开摄像头
      livePusher.startCamera();
      // 打开麦克风
      livePusher.startMicrophone();

      const RTMP_URL =
        "webrtc://221867.push.tlivecloud.com/live/1?txSecret=a2705ae652d04afc52199cb7a218e14a&txTime=6908BAB0";

      // 采集完摄像头画面后自动推流
      // livePusher
      //   .startCamera()
      //   .then(function () {
      //     livePusher.startPush(
      //       RTMP_URL
      //     );
      //   })
      //   .catch(function (error) {
      //     console.log("打开摄像头失败: " + error.toString());
      //   });
      // 采集完摄像头和麦克风之后自动推流
      Promise.all([
        livePusher.startCamera(),
        livePusher.startMicrophone(),
      ]).then(function () {
        livePusher.startPush(RTMP_URL);
      });

      // livePusher.stopPush();
      // 关闭摄像头
      // livePusher.stopCamera();
      // // 关闭麦克风
      // livePusher.stopMicrophone();
    </script>
  </body>
</html>
